version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pglyph_postgres
    restart: always
    environment:
      POSTGRES_DB: pglyph_db
      POSTGRES_USER: pglyph_user
      POSTGRES_PASSWORD: pglyph_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pglyph_user -d pglyph_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pglyph_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://pglyph_user:pglyph_pass@postgres:5432/pglyph_db?schema=public"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: pglyph_user
      DB_PASSWORD: pglyph_pass
      DB_NAME: pglyph_db
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pglyph_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
